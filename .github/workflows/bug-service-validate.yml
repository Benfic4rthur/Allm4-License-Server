name: Validate Bug Report Service

on:
  push:
    branches:
      - feature-bug-report-service

permissions:
  contents: read

concurrency:
  group: bug-service-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install
      - run: npm run check
      - run: npm test
